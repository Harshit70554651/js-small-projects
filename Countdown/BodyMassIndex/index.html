<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body mass Indes (BMI)</title>
    <link rel="stylesheet" href="bmi.css">
</head>

<body>
    <div class="main">
        <h2>Body Mass Index Calculator</h2>

        <p>Your Height (cm)</p>
        <input type="number" placeholder="Enter your height" value="" id="height">

        <p>Your Weight (kg)</p>
        <input type="number" placeholder="Enter your weight" value="" id="weight">

        <button id="btn">Compute Your BMI</button>

        <p>Your BMI</p>
        <input type="number" readonly id="result">
           

          Weight Condition: 
          <p id="condition"></p>
        <!-- <h5 id="condition"></h5> -->

    </div>
    <script src="bmi.js"></script>
</body>

</html>
