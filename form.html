<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            width: 25%;
            height: 65%;
            background-color: palegoldenrod;
            border-radius: 10px;
            border: none;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
           
        }

        h3{
            color: rgb(122, 179, 198);
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            
        }

         input{
            width: 70%;
            padding:8px;
            border-radius:12px;
            border: none;
            
         }
         label{
          align-self: flex-start;
          margin-left: 39px;
          color: black;
          font-weight: 600;
         }
 button{
    width: 50%;
    color: black;
    background-color: rgb(114, 150, 181);
    border: none;
    border-radius: 10px;
    padding: 8px;
    font-weight: 600;

 }
 small{
    color: red;
    font-weight: 600;

 }

        
    </style>
</head>
<body>
    <div class="container">
         <h3>SIGN IN</h3>
     <form id="form">
        <label> Name</label>
        <input type="text"  id="name" placeholder="Enter your name" required>
        <small id="nameError"></small>

        <label> email</label>
        <input type="email"  id="email" placeholder="Enter your email" required>
        <small id="emailerror"></small>


        <label>Password</label>
        <input type="password"  id="password" placeholder="Enter your Password">
        <small id="passworderror"></small>

        <button type="submit" id="btn">Submit</button>
     </form>

    </div>
    <script src="form.js"></script>
</body>
</html>
